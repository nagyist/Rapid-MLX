name: Revoke merge-ready on head update

on:
  pull_request_target:
    types: [synchronize]

permissions: {}

jobs:
  revoke-merge-ready:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'merge-ready') ||
      contains(github.event.pull_request.labels.*.name, 'merge-ready-mac') ||
      contains(github.event.pull_request.labels.*.name, 'merge-requeue-required') ||
      contains(github.event.pull_request.labels.*.name, 'merge-requeue-trigger')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Revoke stale merge authorization
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const authorizationLabels = [
              "merge-ready",
              "merge-ready-mac",
              "merge-requeue-required",
              "merge-requeue-trigger",
            ];
            const carriedLabels = new Set(
              context.payload.pull_request.labels.map((label) => label.name),
            );
            const syncUpdatedAt = Date.parse(
              context.payload.pull_request.updated_at,
            );
            if (!Number.isFinite(syncUpdatedAt)) {
              throw new Error("Synchronize event is missing a valid updated_at.");
            }
            const latestLabeledAt = (events, name) =>
              events
                .filter(
                  (event) =>
                    event.event === "labeled" && event.label?.name === name,
                )
                .map((event) => Date.parse(event.created_at))
                .filter(Number.isFinite)
                .reduce((latest, value) => Math.max(latest, value), -Infinity);

            for (const name of authorizationLabels.filter((label) =>
              carriedLabels.has(label),
            )) {
              // Re-read both live labels and their event generation for each
              // deletion. A single snapshot for the whole loop can erase a
              // ready label deliberately re-applied while this job is delayed.
              const { data: livePull } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });
              if (livePull.head.sha !== context.payload.pull_request.head.sha) {
                core.notice(
                  "A newer head exists; this synchronize event is stale.",
                );
                return;
              }
              const liveLabels = new Set(
                livePull.labels.map((label) => label.name),
              );
              if (!liveLabels.has(name)) {
                continue;
              }
              const events = await github.paginate(
                github.rest.issues.listEvents,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  per_page: 100,
                },
              );
              // A label applied at or after this push belongs to review of the
              // new head. Preserve it even if this old job started late.
              if (latestLabeledAt(events, name) >= syncUpdatedAt) {
                core.notice(
                  `Preserved ${name}; it was applied after this head update.`,
                );
                continue;
              }
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name,
                });
                core.notice(
                  `Removed ${name} from #${context.issue.number} after its head changed.`,
                );
              } catch (error) {
                // Label events race Mergify reconciliation. A missing label is
                // already revoked, so continue cleaning the remaining state;
                // every other API error must surface and fail the workflow.
                if (error.status !== 404) {
                  throw error;
                }
                core.notice(`${name} was already absent; continuing revocation.`);
              }
            }
