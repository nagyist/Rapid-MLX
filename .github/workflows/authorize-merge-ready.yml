name: Bind merge-ready to head

on:
  pull_request_target:
    types: [labeled]

permissions: {}

jobs:
  authorize-ready-head:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.label.name == 'merge-ready' ||
       github.event.label.name == 'merge-ready-mac')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
      statuses: write
    steps:
      - name: Bind ready authorization to the current head
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            // A historical Actions rerun must not replay an old labeled event
            // to clear a dequeue that happened later.  A maintainer can always
            // create a fresh authorization event by removing/re-applying the
            // ready label.
            if (Number(process.env.GITHUB_RUN_ATTEMPT) !== 1) {
              core.setFailed(
                "A merge-ready authorization event cannot be replayed; remove and re-apply the ready label.",
              );
              return;
            }

            const readyLabels = new Set(["merge-ready", "merge-ready-mac"]);
            const { data: livePull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const currentLabels = new Set(
              livePull.labels.map((label) => label.name),
            );
            const present = [...currentLabels].filter((label) =>
              readyLabels.has(label),
            );
            const sameHead =
              livePull.head.sha === context.payload.pull_request.head.sha;
            const authorized =
              sameHead &&
              present.length === 1 &&
              present[0] === context.payload.label.name;
            const state = authorized ? "success" : "failure";
            const description = authorized
              ? `Authorized ${present[0]} on this exact head`
              : "Apply exactly one merge-ready label";

            // Mergify records a batch member dropped untested by bisection as
            // terminally dequeued for this exact head.  Only a fresh, valid
            // ready-label event may clear that bot-owned marker.  The explicit
            // queue action in .mergify.yml then re-enqueues the head; ordinary
            // dequeue events keep the marker and cannot retry themselves.
            if (authorized && currentLabels.has("dequeued")) {
              // Invalidate any success left by an earlier authorization before
              // removing the retry circuit breaker. If any following API call
              // fails, the queue's check-success condition remains blocked.
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.payload.pull_request.head.sha,
                state: "pending",
                context: "merge-ready-head",
                description: `Re-authorizing ${present[0]} on this exact head`,
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/pull/${context.issue.number}`,
              });
              // Mint the one-shot token while both the pending status and the
              // dequeue marker still block Mergify. Every interruption point
              // is then fail-closed and recoverable by another fresh label
              // event: addLabels is idempotent, and a surviving token remains
              // blocked until the final success status is written.
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ["merge-requeue-trigger"],
              });
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: "dequeued",
                });
                core.notice(
                  `Cleared stale dequeued state before re-authorizing ${present[0]}.`,
                );
              } catch (error) {
                // A concurrent Mergify reconciliation may remove the label
                // first.  Missing is the desired state; every other error must
                // fail closed instead of claiming the head was re-authorized.
                if (error.status !== 404) {
                  throw error;
                }
              }
            }

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state,
              context: "merge-ready-head",
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/pull/${context.issue.number}`,
            });

            if (!authorized) {
              core.setFailed(description);
              return;
            }
