merge_queue:
  mode: serial
  max_parallel_checks: 1
  skip_intermediate_results: false
  status_comments: outcomes

merge_protections_settings:
  auto_merge_conditions:
    - or:
        - label = merge-ready
        - label = merge-ready-mac

# ``auto_merge_conditions`` admits a ready head initially, but Mergify keeps a
# bisection member that was dropped untested in a terminal dequeued state.  The
# explicit queue actions are the supported re-entry edge: re-applying the same
# ready label clears the bot-owned ``dequeued`` marker in
# authorize-merge-ready.yml, then this rule queues the still-authorized exact
# head.  The negative marker prevents a failed/dequeued head from retrying by
# itself, so the no-blind-retry budget below remains authoritative.
pull_request_rules:
  - name: enqueue an explicitly authorized no-Mac head
    conditions:
      - base = main
      - -draft
      - -from-fork
      - label = merge-ready
      - -label = merge-ready-mac
      - -label = dequeued
      - check-success = merge-ready-head
    actions:
      queue:
        name: no-mac-batch

  - name: enqueue an explicitly authorized Mac head
    conditions:
      - base = main
      - -draft
      - -from-fork
      - label = merge-ready-mac
      - -label = merge-ready
      - -label = dequeued
      - check-success = merge-ready-head
    actions:
      queue:
        name: mac-batch

queue_rules:
  - name: no-mac-batch
    queue_branch_prefix: mergify/merge-queue/
    batch_size: 4
    batch_max_wait_time: 5 min
    batch_max_failure_resolution_attempts: 2
    checks_timeout: 90 min
    max_checks_retries: 0
    merge_method: squash
    branch_protection_injection_mode: queue
    queue_conditions:
      - base = main
      - -draft
      - -from-fork
      - label = merge-ready
      - -label = merge-ready-mac
      - -label = version-bump
      - -label = skip-version-bump
      - "-title ~= ^chore: bump version to "
      - check-success = merge-ready-head
      - check-success = @github-actions/merge-lane-no-mac
      - check-success = @github-actions/tests
      - check-success = @github-actions/desktop-tests
      - check-success = @github-actions/version-bump-guard
    merge_conditions:
      - check-success = @github-actions/tests
      - check-success = @github-actions/desktop-tests
      - check-success = @github-actions/version-bump-guard

  - name: mac-batch
    queue_branch_prefix: mergify/merge-queue/
    batch_size: 4
    batch_max_wait_time: 15 min
    batch_max_failure_resolution_attempts: 2
    checks_timeout: 90 min
    max_checks_retries: 0
    merge_method: squash
    branch_protection_injection_mode: queue
    queue_conditions:
      - base = main
      - -draft
      - -from-fork
      - label = merge-ready-mac
      - -label = merge-ready
      - -label = version-bump
      - -label = skip-version-bump
      - "-title ~= ^chore: bump version to "
      - check-success = merge-ready-head
      - check-success = @github-actions/merge-lane-mac
      - check-success = @github-actions/tests
      - check-success = @github-actions/desktop-tests
      - check-success = @github-actions/version-bump-guard
    merge_conditions:
      - check-success = @github-actions/tests
      - check-success = @github-actions/desktop-tests
      - check-success = @github-actions/version-bump-guard
